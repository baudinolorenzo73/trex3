name: Compila APK e Zepp OS
on:
  push:
    branches: [main, sviluppo-prima-prova]
    paths: ['android/**', 'zeppos/**', 'scripts/make_icon.py', '.github/workflows/build-apps.yml', 'tests/**']
  pull_request:
    paths: ['android/**', 'zeppos/**', 'scripts/make_icon.py', '.github/workflows/build-apps.yml', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  watch:
    name: App orologio (ZAB)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python3 scripts/make_icon.py
      - run: npm install --no-audit --no-fund
        working-directory: zeppos
      - name: Compila Zepp OS
        run: npx --yes @zeppos/zeus-cli@1.9.3 build
        working-directory: zeppos
      - uses: actions/upload-artifact@v4
        with:
          name: trex3-orologio-0.1.0
          path: zeppos/dist/**/*.zab
          if-no-files-found: error
          retention-days: 30
  android:
    name: Ponte Android (APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Installa SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Conserva firma di sviluppo fra compilazioni
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: trex3-debug-signing-v1
      - name: Test e compilazione
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
      - name: Rinomina APK e calcola checksum
        run: |
          mkdir -p out-android
          cp android/app/build/outputs/apk/debug/app-debug.apk out-android/Trex3_Bridge-0.1.0.apk
          sha256sum out-android/*.apk > out-android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trex3-android-0.1.0
          path: out-android/
          if-no-files-found: error
          retention-days: 30
